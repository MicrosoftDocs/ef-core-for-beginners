name: build

on:
  push:
  pull_request:
    branches: [ main ]
    paths:
    - '**.cs'
    - '**.csproj'
    - '**.cshtml'
    - '**.css'
    - '**.tour'

env:
  DOTNET_VERSION: '6.0.x' # The .NET SDK version to use

jobs:
  build:

    name: Build All Projects
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
        - 1-getting-started
        - 2-existing-databases
        - 3-web-sites
        - 4-database-providers
        - 5-performance-tips

    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      - name: Setup .NET
        uses: actions/setup-dotnet@8e6bd2905eef86446227f003dda1deb3916c4aaf # v2.2.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Build Step - ${{ matrix.project }}
        run: dotnet build ./parts/${{ matrix.project }}/ContosoPizza/ContosoPizza.csproj

  validate-tours:

    name: Validate CodeTour Files
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0

      - name: Validate that every .tour file is valid JSON
        run: |
          for tour in .tours/*.tour; do
            echo "Validating $tour"
            python3 -m json.tool "$tour" > /dev/null
          done
