name: build

on:
  push:
  pull_request:
    branches: [ main ]
    paths:
    - '**.cs'
    - '**.csproj'
    - '**.cshtml'
    - '**.css'
    - '**.tour'

env:
  DOTNET_VERSION: '6.0.x' # The .NET SDK version to use

jobs:
  build:

    name: Build All Projects
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
        - 1-getting-started
        - 2-existing-databases
        - 3-web-sites
        - 4-database-providers
        - 5-performance-tips

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Build Step - ${{ matrix.project }}
        run: dotnet build ./parts/${{ matrix.project }}/ContosoPizza/ContosoPizza.csproj

  validate-tours:

    name: Validate CodeTour Files
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate that every .tour file is valid JSON
        run: |
          for tour in .tours/*.tour; do
            echo "Validating $tour"
            python3 -m json.tool "$tour" > /dev/null
          done
